name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Lint
        run: npm run lint

      - name: Type-check realtime worker
        run: npm run check:realtime

      - name: Build and test production responses
        run: npm test

      - name: Install Chromium for CSP regression test
        run: npx playwright install --with-deps chromium

      - name: Test browser injection protections
        run: npm run test:security
